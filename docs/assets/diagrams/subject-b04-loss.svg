<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1100" width="560" role="img" aria-labelledby="b04-title b04-desc" height="1100">
  <title id="b04-title">动态损耗因素示意</title>
  <desc id="b04-desc">三幅纵向排列的示意图：整块金属、叠片和铁氧体中的涡流路径对比；磁滞、涡流和总损耗随频率变化的双对数趋势；温度通过电阻率、饱和磁化和各向异性影响损耗的路径。示意图，不是实测数据。</desc>
  <defs>
    <marker id="b04-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4f6f"/>
    </marker>
    <marker id="b04-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b87324"/>
    </marker>
  </defs>

  <style>
    .b04-text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif; fill: #22303f; }
    .b04-title { font-size: 21px; font-weight: 700; }
    .b04-panel-title { font-size: 19px; font-weight: 700; }
    .b04-label { font-size: 17px; font-weight: 600; }
    .b04-small { font-size: 16px; fill: #4d5d6b; }
    .b04-note { font-size: 15px; fill: #5a6875; }
    .b04-box { fill: #f5f8fb; stroke: #b8cddd; stroke-width: 1.2; }
    .b04-metal { fill: #dce9f3; stroke: #4f7d9f; stroke-width: 1.3; }
    .b04-ins { fill: #f3e6cf; stroke: #b87324; stroke-width: 1.0; }
    .b04-ferrite { fill: #e4efe4; stroke: #5f8a5f; stroke-width: 1.3; }
    .b04-axis { stroke: #40566b; stroke-width: 1.5; fill: none; }
    .b04-curve-h { stroke: #2f6f9f; stroke-width: 2.6; fill: none; }
    .b04-curve-e { stroke: #b87324; stroke-width: 2.6; fill: none; }
    .b04-curve-t { stroke: #7a5a9a; stroke-width: 2.8; fill: none; stroke-dasharray: 7 5; }
  </style>

  <text class="b04-text b04-title" x="20" y="36">动态磁化损耗的主要因素（示意，非实测）</text>

  <!-- panel a -->
  <rect class="b04-box" x="20" y="60" width="520" height="330" rx="10"/>
  <text class="b04-text b04-panel-title" x="34" y="92">① 涡流路径：整块 / 叠片 / 铁氧体</text>

  <rect class="b04-metal" x="60" y="110" width="440" height="60" rx="3"/>
  <ellipse cx="160" cy="140" rx="62" ry="20" fill="none" stroke="#2f6f9f" stroke-width="1.7"/>
  <ellipse cx="160" cy="140" rx="38" ry="12" fill="none" stroke="#2f6f9f" stroke-width="1.5"/>
  <ellipse cx="390" cy="140" rx="55" ry="18" fill="none" stroke="#2f6f9f" stroke-width="1.7"/>
  <text class="b04-text b04-label" x="60" y="196">整块金属：回路大，涡流损耗大</text>

  <rect class="b04-metal" x="60" y="215" width="440" height="14" rx="1"/>
  <rect class="b04-ins" x="60" y="231" width="440" height="4" rx="1"/>
  <rect class="b04-metal" x="60" y="237" width="440" height="14" rx="1"/>
  <rect class="b04-ins" x="60" y="253" width="440" height="4" rx="1"/>
  <rect class="b04-metal" x="60" y="259" width="440" height="14" rx="1"/>
  <ellipse cx="160" cy="222" rx="35" ry="4" fill="none" stroke="#b87324" stroke-width="1.3"/>
  <ellipse cx="390" cy="222" rx="32" ry="4" fill="none" stroke="#b87324" stroke-width="1.3"/>
  <ellipse cx="160" cy="244" rx="35" ry="4" fill="none" stroke="#b87324" stroke-width="1.3"/>
  <ellipse cx="390" cy="244" rx="32" ry="4" fill="none" stroke="#b87324" stroke-width="1.3"/>
  <ellipse cx="160" cy="266" rx="35" ry="4" fill="none" stroke="#b87324" stroke-width="1.3"/>
  <ellipse cx="390" cy="266" rx="32" ry="4" fill="none" stroke="#b87324" stroke-width="1.3"/>
  <text class="b04-text b04-label" x="60" y="306">叠片/薄带：绝缘层切断路径</text>

  <rect class="b04-ferrite" x="60" y="320" width="440" height="40" rx="3"/>
  <circle cx="130" cy="340" r="3.2" fill="#5f8a5f"/>
  <circle cx="200" cy="334" r="2.8" fill="#5f8a5f"/>
  <circle cx="280" cy="346" r="2.8" fill="#5f8a5f"/>
  <circle cx="360" cy="336" r="3.2" fill="#5f8a5f"/>
  <circle cx="440" cy="344" r="2.8" fill="#5f8a5f"/>
  <text class="b04-text b04-label" x="60" y="378">铁氧体：ρ 高，涡流小；Bs 较低</text>

  <!-- panel b -->
  <rect class="b04-box" x="20" y="410" width="520" height="330" rx="10"/>
  <text class="b04-text b04-panel-title" x="34" y="442">② 损耗随频率（双对数示意）</text>

  <path class="b04-axis" d="M 70 700 L 525 700" marker-end="url(#b04-arrow)"/>
  <path class="b04-axis" d="M 70 700 L 70 470" marker-end="url(#b04-arrow)"/>
  <text class="b04-text b04-small" x="430" y="726">f（对数）</text>
  <text class="b04-text b04-small" x="40" y="476">P（功率密度）</text>

  <path class="b04-curve-h" d="M 90 680 L 500 580"/>
  <path class="b04-curve-e" d="M 90 680 L 500 520"/>
  <path class="b04-curve-t" d="M 90 680 L 500 490"/>

  <text class="b04-text b04-label" x="350" y="646" fill="#2f6f9f">磁滞损耗 ∝ f</text>
  <text class="b04-text b04-label" x="350" y="540" fill="#8a5415">涡流损耗 ∝ f²</text>
  <text class="b04-text b04-label" x="356" y="500" fill="#65477f">总损耗</text>
  <text class="b04-text b04-note" x="70" y="724">斜率只是趋势示意，不是材料数据。</text>

  <!-- panel c -->
  <rect class="b04-box" x="20" y="760" width="520" height="300" rx="10"/>
  <text class="b04-text b04-panel-title" x="34" y="792">③ 温度影响路径</text>

  <rect x="60" y="810" width="440" height="40" rx="7" fill="#e9eef4" stroke="#7f93a6" stroke-width="1.2"/>
  <text class="b04-text b04-label" x="76" y="837">温度 T ↑</text>

  <rect x="60" y="862" width="440" height="42" rx="7" fill="#f7efe2" stroke="#c8a06a" stroke-width="1.1"/>
  <text class="b04-text b04-small" x="76" y="882">金属 ρ ↑ → 涡流损耗可能下降</text>
  <text class="b04-text b04-small" x="76" y="900">但 μ、磁通分布也变</text>

  <rect x="60" y="914" width="440" height="42" rx="7" fill="#f7efe2" stroke="#c8a06a" stroke-width="1.1"/>
  <text class="b04-text b04-small" x="76" y="934">饱和磁化与 Bs ↓ → 饱和裕量变小</text>
  <text class="b04-text b04-small" x="76" y="952">工作点更靠近膝点</text>

  <rect x="60" y="966" width="440" height="42" rx="7" fill="#f7efe2" stroke="#c8a06a" stroke-width="1.1"/>
  <text class="b04-text b04-small" x="76" y="986">矫顽力、各向异性、磁致伸缩变化 → 磁滞损耗变化</text>
  <text class="b04-text b04-small" x="76" y="1004">方向随材料而异，需曲线</text>

  <rect x="60" y="1018" width="440" height="36" rx="7" fill="#ece7f3" stroke="#9a86b5" stroke-width="1.1"/>
  <text class="b04-text b04-small" x="76" y="1041">损耗 ↔ 温升：需热磁联合评估</text>

  <path d="M 280 850 L 280 862" stroke="#40566b" stroke-width="1.5" marker-end="url(#b04-arrow)"/>
  <path d="M 280 904 L 280 914" stroke="#40566b" stroke-width="1.5" marker-end="url(#b04-arrow)"/>
  <path d="M 280 956 L 280 966" stroke="#40566b" stroke-width="1.5" marker-end="url(#b04-arrow)"/>
  <path d="M 280 1008 L 280 1018" stroke="#40566b" stroke-width="1.5" marker-end="url(#b04-arrow)"/>
  <path d="M 500 1036 C 532 1010 532 850 500 830" stroke="#9a86b5" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#b04-arrow)"/>

  <text class="b04-text b04-note" x="20" y="1088">注：涡流公式仅在薄片、均匀磁通、正弦、无趋肤效应时成立。</text>
</svg>
