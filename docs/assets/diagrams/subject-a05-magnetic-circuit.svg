<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520"> role="img" aria-labelledby="a05title a05desc">
  <title id="a05title">磁体、软磁件、气隙与等效磁路</title>
  <desc id="a05desc">左图为永磁体经软磁件形成磁通路径，右侧气隙中放置传感器，并标出漏磁；右图为串联磁动势、磁阻的集总磁路模型。</desc>
  <defs>
    <marker id="a05-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3f51b5"/>
    </marker>
    <marker id="a05-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <text x="30" y="32" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#263238">(a) 磁通路径：软磁件引导，气隙和空气旁路</text>

  <rect x="80" y="120" width="60" height="240" rx="5" fill="#e8eefc" stroke="#3f51b5" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#1a237e">永磁体</text>

  <rect x="140" y="120" width="360" height="40" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <rect x="140" y="320" width="360" height="40" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <rect x="460" y="160" width="40" height="80" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <rect x="460" y="280" width="40" height="40" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <rect x="460" y="240" width="40" height="40" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <rect x="470" y="248" width="20" height="24" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="320" y="105" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#37474f">软磁件</text>
  <text x="530" y="250" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#8d6e00">气隙</text>
  <text x="530" y="270" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1b5e20">传感器</text>

  <line x1="210" y1="140" x2="330" y2="140" stroke="#3f51b5" stroke-width="3" marker-end="url(#a05-blue)"/>
  <line x1="480" y1="185" x2="480" y2="225" stroke="#3f51b5" stroke-width="3" marker-end="url(#a05-blue)"/>
  <line x1="330" y1="340" x2="210" y2="340" stroke="#3f51b5" stroke-width="3" marker-end="url(#a05-blue)"/>
  <line x1="480" y1="300" x2="480" y2="335" stroke="#3f51b5" stroke-width="3" marker-end="url(#a05-blue)"/>

  <line x1="280" y1="120" x2="280" y2="80" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a05-orange)"/>
  <line x1="360" y1="120" x2="360" y2="80" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a05-orange)"/>
  <line x1="280" y1="360" x2="280" y2="400" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a05-orange)"/>
  <line x1="360" y1="360" x2="360" y2="400" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a05-orange)"/>
  <text x="380" y="78" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">漏磁</text>
  <text x="380" y="405" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">漏磁</text>

  <text x="30" y="450" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">磁通没有理想“绝缘体”：空气、气隙、周围结构都参与。</text>
  <text x="30" y="475" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">高磁导率只是让磁通更容易走这条路，不是全部磁通都被锁住。</text>

  <line x1="570" y1="45" x2="570" y2="490" stroke="#cfd8dc" stroke-width="1.5"/>

  <text x="715" y="32" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#263238">(b) 集总磁路：串联模型</text>

  <line x1="620" y1="120" x2="830" y2="120" stroke="#37474f" stroke-width="2"/>
  <line x1="620" y1="380" x2="830" y2="380" stroke="#37474f" stroke-width="2"/>
  <line x1="620" y1="120" x2="620" y2="380" stroke="#37474f" stroke-width="2"/>
  <line x1="830" y1="120" x2="830" y2="380" stroke="#37474f" stroke-width="2"/>

  <circle cx="620" cy="250" r="28" fill="#e8eefc" stroke="#3f51b5" stroke-width="2"/>
  <text x="620" y="247" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#1a237e">F</text>
  <text x="620" y="265" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#1a237e">磁动势</text>

  <rect x="690" y="105" width="80" height="30" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="730" y="125" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">R<tspan baseline-shift="sub" font-size="0.72em">m</tspan></text>
  <rect x="815" y="215" width="30" height="70" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="800" y="255" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">R<tspan baseline-shift="sub" font-size="0.72em">g</tspan></text>
  <rect x="690" y="365" width="80" height="30" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="730" y="385" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">R<tspan baseline-shift="sub" font-size="0.72em">l</tspan></text>

  <line x1="650" y1="120" x2="680" y2="120" stroke="#3f51b5" stroke-width="2" marker-end="url(#a05-blue)"/>
  <text x="705" y="160" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">软磁件</text>
  <text x="790" y="310" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">气隙</text>
  <text x="705" y="415" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">漏磁旁路</text>

  <text x="590" y="440" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">Φ = F / (R<tspan baseline-shift="sub" font-size="0.72em">m</tspan> + R<tspan baseline-shift="sub" font-size="0.72em">g</tspan> + R<tspan baseline-shift="sub" font-size="0.72em">l</tspan>)</text>
  <text x="590" y="465" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">类比失效：漏磁、饱和、边缘效应、非线性。</text>
  <text x="590" y="490" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">R<tspan baseline-shift="sub" font-size="0.72em">g</tspan> 常因气隙低磁导率而占主导。</text>
</svg>
