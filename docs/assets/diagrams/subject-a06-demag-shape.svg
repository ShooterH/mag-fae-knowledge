<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560"> role="img" aria-labelledby="a06title a06desc">
  <title id="a06title">长棒、球和薄片的退磁场与负载线</title>
  <desc id="a06desc">左图对比长棒、球和沿法向磁化的薄片，标出内部磁化强度 M、反向退磁场 H<tspan baseline-shift="sub" font-size="0.72em">d</tspan> 和退磁因子 N；右图为第二象限中用 |H| 表示的退磁曲线和三条不同斜率的负载线。</desc>
  <defs>
    <marker id="a06-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3f51b5"/>
    </marker>
    <marker id="a06-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <text x="30" y="32" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#263238">同一材料，形状改变退磁场和工作点</text>

  <text x="130" y="80" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">长棒：N 小</text>
  <rect x="45" y="110" width="170" height="48" rx="5" fill="#e8eefc" stroke="#3f51b5" stroke-width="2"/>
  <line x1="75" y1="134" x2="185" y2="134" stroke="#3f51b5" stroke-width="3" marker-end="url(#a06-blue)"/>
  <line x1="165" y1="155" x2="95" y2="155" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a06-orange)"/>
  <text x="205" y="130" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1a237e">M</text>
  <text x="50" y="175" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#bf360c">H<tspan baseline-shift="sub" font-size="0.72em">d</tspan></text>
  <text x="130" y="195" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">长径比 10：N ≈ 0.017</text>
  <text x="130" y="215" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">P<tspan baseline-shift="sub" font-size="0.72em">c</tspan> ≈ 57，B<tspan baseline-shift="sub" font-size="0.72em">in</tspan> 较高</text>

  <text x="310" y="80" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">球：N = 1/3</text>
  <circle cx="310" cy="145" r="48" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <line x1="275" y1="145" x2="345" y2="145" stroke="#3f51b5" stroke-width="3" marker-end="url(#a06-blue)"/>
  <line x1="345" y1="160" x2="285" y2="160" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a06-orange)"/>
  <text x="355" y="140" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1a237e">M</text>
  <text x="250" y="185" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#bf360c">H<tspan baseline-shift="sub" font-size="0.72em">d</tspan></text>
  <text x="310" y="215" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">N = 0.333，P<tspan baseline-shift="sub" font-size="0.72em">c</tspan> ≈ 2</text>
  <text x="310" y="235" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">工作点居中</text>

  <text x="430" y="80" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">薄片：N ≈ 1</text>
  <rect x="405" y="105" width="50" height="130" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <line x1="430" y1="115" x2="430" y2="215" stroke="#3f51b5" stroke-width="3" marker-end="url(#a06-blue)"/>
  <line x1="450" y1="205" x2="450" y2="125" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a06-orange)"/>
  <text x="458" y="110" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1a237e">M</text>
  <text x="458" y="225" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#bf360c">H<tspan baseline-shift="sub" font-size="0.72em">d</tspan></text>
  <text x="430" y="255" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">法向磁化：N ≈ 1</text>
  <text x="430" y="275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">P<tspan baseline-shift="sub" font-size="0.72em">c</tspan> ≈ 0，B<tspan baseline-shift="sub" font-size="0.72em">in</tspan> 很低</text>

  <text x="30" y="320" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">N 与磁化方向有关；形状改变工作点，不改变材料的 Br。</text>
  <text x="30" y="345" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">示意：箭头长度不代表真实数值；薄片按法向磁化画。</text>

  <line x1="510" y1="55" x2="510" y2="520" stroke="#cfd8dc" stroke-width="1.5"/>

  <text x="700" y="32" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#263238">第二象限：负载线与工作点</text>

  <line x1="570" y1="440" x2="845" y2="440" stroke="#37474f" stroke-width="2" marker-end="url(#a06-blue)"/>
  <line x1="570" y1="440" x2="570" y2="75" stroke="#37474f" stroke-width="2" marker-end="url(#a06-blue)"/>
  <text x="838" y="485" text-anchor="end" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#37474f">|H| (kA/m)</text>
  <text x="545" y="82" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#37474f">B (T)</text>

  <line x1="570" y1="120" x2="805" y2="440" stroke="#3f51b5" stroke-width="3"/>
  <text x="700" y="105" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#1a237e">退磁曲线（示意）</text>
  <text x="580" y="115" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#1a237e">B<tspan baseline-shift="sub" font-size="0.72em">r</tspan></text>
  <text x="805" y="462" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#1a237e">H<tspan baseline-shift="sub" font-size="0.72em">cB</tspan></text>

  <line x1="570" y1="440" x2="584" y2="122" stroke="#2e7d32" stroke-width="2"/>
  <line x1="570" y1="440" x2="613" y2="163" stroke="#ef6c00" stroke-width="2"/>
  <line x1="570" y1="440" x2="770" y2="380" stroke="#8e24aa" stroke-width="2"/>

  <circle cx="584" cy="122" r="4" fill="#2e7d32"/>
  <circle cx="613" cy="163" r="4" fill="#ef6c00"/>
  <circle cx="770" cy="380" r="4" fill="#8e24aa"/>

  <text x="590" y="300" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#1b5e20">长棒</text>
  <text x="620" y="190" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#bf360c">球/中等</text>
  <text x="778" y="375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#6a1b9a">薄片</text>

  <text x="570" y="505" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">教学曲线：B<tspan baseline-shift="sub" font-size="0.72em">r</tspan> = 1.2 T，H<tspan baseline-shift="sub" font-size="0.72em">cB</tspan> = 900 kA/m；</text>
  <text x="570" y="525" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">交点只用于读图练习，不是牌号数据。</text>

  <text x="30" y="530" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">N 值取自教材表 1.1 的圆柱近似；实际几何需查表、仿真和实测。</text>
</svg>
