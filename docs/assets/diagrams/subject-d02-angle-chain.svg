<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" width="1000" height="620">
<title id="t">从磁场到角度的信号链</title><desc id="d">从旋转磁体、传感元件、桥路放大、ADC、atan2 或 CORDIC 到校准输出的信号链，并用单位圆说明四个象限中 atan2 的角度结果。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
</defs>
<rect width="1000" height="620" fill="#ffffff"/>
<g font-family="font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#1f2937">
<text x="30" y="32" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2937">从磁场到角度：一条完整的信号链</text>
<text x="30" y="55" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">以端轴磁体为例；Hall 与磁电阻桥都只是链路的入口（示意，非按比例）</text>
<rect x="35" y="78" width="140" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="105.0" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e3a8a">磁体旋转</text>
<text x="105.0" y="125" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">Bx, By 随 θ 变化</text>
<line x1="178" y1="111.0" x2="190" y2="111.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="193" y="78" width="140" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="263.0" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e3a8a">传感元件</text>
<text x="263.0" y="125" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">Hall / AMR / GMR / TMR</text>
<line x1="336" y1="111.0" x2="348" y2="111.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="351" y="78" width="140" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="421.0" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e3a8a">桥路与放大</text>
<text x="421.0" y="125" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">差分 SIN / COS</text>
<line x1="494" y1="111.0" x2="506" y2="111.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="509" y="78" width="140" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="579.0" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e3a8a">ADC</text>
<text x="579.0" y="125" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">模拟量数字化</text>
<line x1="652" y1="111.0" x2="664" y2="111.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="667" y="78" width="140" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="737.0" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e3a8a">atan2 / CORDIC</text>
<text x="737.0" y="125" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">由两分量求角</text>
<line x1="810" y1="111.0" x2="822" y2="111.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="825" y="78" width="140" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="895.0" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e3a8a">校准与输出</text>
<text x="895.0" y="125" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">零偏、方向、协议</text>
<text x="35" y="170" font-size="11" text-anchor="start" font-weight="normal" fill="#475569">每一级都可能引入误差：敏感方向、场窗口、桥路偏置、ADC 噪声、atan2 象限、校准残差。</text>
<circle cx="245" cy="410" r="130" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<line x1="90" y1="410" x2="400" y2="410" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="245" y1="565" x2="245" y2="255" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="405" y="414" font-size="12" text-anchor="start" font-weight="bold" fill="#475569">Bx</text>
<text x="251" y="250" font-size="12" text-anchor="start" font-weight="bold" fill="#475569">By</text>
<line x1="245" y1="410" x2="357.58330249197707" y2="345.0" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="390.4922678357857" y="330.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4ed8">30°</text>
<text x="390.4922678357857" y="346.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">(0.87, 0.50)</text>
<line x1="245" y1="410" x2="132.41669750802296" y2="345.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="99.5077321642143" y="330.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#b45309">150°</text>
<text x="99.5077321642143" y="346.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">(-0.87, 0.50)</text>
<line x1="245" y1="410" x2="132.416697508023" y2="475.0" stroke="#047857" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="99.5077321642143" y="498.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#047857">210°</text>
<text x="99.5077321642143" y="514.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">(-0.87, -0.50)</text>
<line x1="245" y1="410" x2="357.583302491977" y2="475.00000000000006" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="390.49226783578564" y="498.00000000000006" font-size="12" text-anchor="middle" font-weight="bold" fill="#7c3aed">330°</text>
<text x="390.49226783578564" y="514.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">(0.87, -0.50)</text>
<text x="245" y="595" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">单位圆：同一个比值可能落在两个象限，符号决定唯一角</text>
<rect x="480" y="215" width="490" height="375" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="505" y="245" font-size="14" text-anchor="start" font-weight="bold" fill="#1e3a8a">理想端轴关系</text>
<text x="505" y="275" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">Bx = B0·cosθ，By = B0·sinθ</text>
<text x="505" y="300" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">θ = atan2(By, Bx)，再映射到 [0°, 360°)</text>
<text x="505" y="330" font-size="12" text-anchor="start" font-weight="bold" fill="#334155">四象限数值例（B0 = 1）</text>
<text x="510" y="358" font-size="11" text-anchor="start" font-weight="normal" fill="#1d4ed8">第 1 象限</text>
<text x="635" y="358" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">(0.866, 0.500)</text>
<text x="790" y="358" font-size="11" text-anchor="start" font-weight="bold" fill="#1d4ed8">→ 30°</text>
<text x="510" y="386" font-size="11" text-anchor="start" font-weight="normal" fill="#b45309">第 2 象限</text>
<text x="635" y="386" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">(-0.866, 0.500)</text>
<text x="790" y="386" font-size="11" text-anchor="start" font-weight="bold" fill="#b45309">→ 150°</text>
<text x="510" y="414" font-size="11" text-anchor="start" font-weight="normal" fill="#047857">第 3 象限</text>
<text x="635" y="414" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">(-0.866, -0.500)</text>
<text x="790" y="414" font-size="11" text-anchor="start" font-weight="bold" fill="#047857">→ 210°</text>
<text x="510" y="442" font-size="11" text-anchor="start" font-weight="normal" fill="#7c3aed">第 4 象限</text>
<text x="635" y="442" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">(0.866, -0.500)</text>
<text x="790" y="442" font-size="11" text-anchor="start" font-weight="bold" fill="#7c3aed">→ 330°</text>
<text x="505" y="500" font-size="10" text-anchor="start" font-weight="normal" fill="#b91c1c">普通 arctan(By/Bx) 只返回 (-90°, 90°)；它会把第 1/3 象限、</text>
<text x="505" y="518" font-size="10" text-anchor="start" font-weight="normal" fill="#b91c1c">第 2/4 象限混在一起，所以角度计算要用 atan2。</text>
<text x="505" y="548" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">周期提示：AMR 原始响应常为 180° 周期；GMR/TMR 可实现</text>
<text x="505" y="566" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">360° 正余弦输出，但具体范围仍看型号、桥路和算法。</text>
</g></svg>
