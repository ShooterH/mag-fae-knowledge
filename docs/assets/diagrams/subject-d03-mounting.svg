<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="t d" width="1000" height="700">
<title id="t">编码器磁体与安装几何</title><desc id="d">端轴、侧轴、离轴和空心轴多极环四种安装几何的统一坐标示意，标出旋转轴、气隙、偏心和充磁方向。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
</defs>
<rect width="1000" height="700" fill="#ffffff"/>
<g font-family="font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#1f2937">
<text x="30" y="32" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2937">编码器磁体与安装几何：四种结构，一套坐标</text>
<text x="30" y="55" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">z 为旋转轴，xy 为传感器平面；g 为气隙，e 为偏心，α 为倾斜（示意，非按比例）</text>
<rect x="30" y="75" width="460" height="255" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50" y="103" font-size="14" text-anchor="start" font-weight="bold" fill="#1e3a8a">A. 端轴（on-axis）</text>
<rect x="510" y="75" width="460" height="255" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="530" y="103" font-size="14" text-anchor="start" font-weight="bold" fill="#1e3a8a">B. 侧轴（side-shaft）</text>
<rect x="30" y="350" width="460" height="255" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50" y="378" font-size="14" text-anchor="start" font-weight="bold" fill="#1e3a8a">C. 离轴（off-axis）</text>
<rect x="510" y="350" width="460" height="255" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="530" y="378" font-size="14" text-anchor="start" font-weight="bold" fill="#1e3a8a">D. 空心轴 / 多极环</text>
<g transform="translate(30,75)"><rect x="175" y="52" width="32" height="172" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
<line x1="191" y1="40" x2="191" y2="236" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="198" y="47" font-size="11" text-anchor="start" font-weight="bold" fill="#475569">z</text>
<rect x="148" y="127" width="44" height="26" rx="2" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
<rect x="192" y="127" width="44" height="26" rx="2" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="170" y="145" font-size="12" text-anchor="middle" font-weight="bold" fill="#7f1d1d">N</text>
<text x="214" y="145" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e3a8a">S</text>
<line x1="158" y1="164" x2="226" y2="164" stroke="#b45309" stroke-width="2.2" marker-end="url(#arR)"/>
<text x="232" y="169" font-size="11" text-anchor="start" font-weight="bold" fill="#b45309">M</text>
<text x="120" y="120" font-size="11" text-anchor="start" font-weight="normal" fill="#475569">磁体</text>
<rect x="148" y="207" width="90" height="16" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<text x="193" y="243" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">传感器（xy 平面）</text>
<line x1="265" y1="153" x2="265" y2="207" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="272" y="184" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2937">g</text>
<line x1="200" y1="217" x2="240" y2="217" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arB)"/>
<text x="244" y="221" font-size="9" text-anchor="start" font-weight="normal" fill="#1d4ed8">Bx</text>
<line x1="190" y1="217" x2="190" y2="187" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arB)"/>
<text x="182" y="183" font-size="9" text-anchor="end" font-weight="normal" fill="#1d4ed8">By</text>
<text x="120" y="205" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">直径充磁</text>
</g><g transform="translate(510,75)"><rect x="55" y="52" width="28" height="172" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
<line x1="69" y1="40" x2="69" y2="236" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="47" font-size="11" text-anchor="start" font-weight="bold" fill="#475569">z</text>
<rect x="83" y="93" width="52" height="105" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
<rect x="83" y="93" width="52" height="52" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="109" y="123" font-size="11" text-anchor="middle" font-weight="bold" fill="#1e3a8a">N</text>
<text x="109" y="170" font-size="11" text-anchor="middle" font-weight="bold" fill="#7f1d1d">S</text>
<text x="92" y="215" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">磁体</text>
<line x1="145" y1="145" x2="275" y2="145" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="208" y="137" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2937">g</text>
<rect x="280" y="120" width="82" height="50" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<text x="321" y="150" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">传感器</text>
<line x1="363" y1="133" x2="405" y2="133" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arB)"/>
<text x="409" y="137" font-size="9" text-anchor="start" font-weight="normal" fill="#1d4ed8">敏感轴</text>
<text x="225" y="195" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">读侧面场；磁体轴向长度也进入信号</text>
</g><g transform="translate(30,350)"><rect x="130" y="52" width="32" height="172" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
<line x1="146" y1="40" x2="146" y2="246" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="154" y="47" font-size="11" text-anchor="start" font-weight="bold" fill="#475569">z</text>
<rect x="100" y="127" width="46" height="24" rx="2" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
<rect x="146" y="127" width="46" height="24" rx="2" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="123" y="144" font-size="10" text-anchor="middle" font-weight="bold" fill="#7f1d1d">N</text>
<text x="169" y="144" font-size="10" text-anchor="middle" font-weight="bold" fill="#1e3a8a">S</text>
<text x="90" y="120" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">磁体</text>
<rect x="285" y="190" width="90" height="16" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<text x="330" y="225" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">传感器</text>
<line x1="146" y1="240" x2="330" y2="240" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="238" y="233" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2937">e</text>
<line x1="330" y1="151" x2="330" y2="190" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="338" y="173" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2937">g</text>
<text x="270" y="257" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">e 与 g 同时改变敏感体积内的场形</text>
</g><g transform="translate(510,350)"><rect x="215" y="45" width="30" height="200" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
<line x1="230" y1="33" x2="230" y2="255" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="238" y="40" font-size="11" text-anchor="start" font-weight="bold" fill="#475569">z</text>
<path d="M 302.0 150.0 A 72.0 72.0 0 0 0 280.9 99.1" fill="none" stroke="#fecaca" stroke-width="40" stroke-linecap="butt"/>
<path d="M 280.9 99.1 A 72.0 72.0 0 0 0 230.0 78.0" fill="none" stroke="#bfdbfe" stroke-width="40" stroke-linecap="butt"/>
<path d="M 230.0 78.0 A 72.0 72.0 0 0 0 179.1 99.1" fill="none" stroke="#fecaca" stroke-width="40" stroke-linecap="butt"/>
<path d="M 179.1 99.1 A 72.0 72.0 0 0 0 158.0 150.0" fill="none" stroke="#bfdbfe" stroke-width="40" stroke-linecap="butt"/>
<path d="M 158.0 150.0 A 72.0 72.0 0 0 0 179.1 200.9" fill="none" stroke="#fecaca" stroke-width="40" stroke-linecap="butt"/>
<path d="M 179.1 200.9 A 72.0 72.0 0 0 0 230.0 222.0" fill="none" stroke="#bfdbfe" stroke-width="40" stroke-linecap="butt"/>
<path d="M 230.0 222.0 A 72.0 72.0 0 0 0 280.9 200.9" fill="none" stroke="#fecaca" stroke-width="40" stroke-linecap="butt"/>
<path d="M 280.9 200.9 A 72.0 72.0 0 0 0 302.0 150.0" fill="none" stroke="#bfdbfe" stroke-width="40" stroke-linecap="butt"/>
<circle cx="230" cy="150" r="52" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<circle cx="230" cy="150" r="92" fill="none" stroke="#64748b" stroke-width="1.2"/>
<text x="330" y="72" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">N/S 交替，p 对极</text>
<rect x="190" y="255" width="80" height="15" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<text x="230" y="290" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">传感器</text>
<line x1="230" y1="242" x2="230" y2="255" stroke="#334155" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="238" y="251" font-size="10" text-anchor="start" font-weight="bold" fill="#1f2937">g</text>
<text x="90" y="315" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">相位、极距和圆度都会进入角度</text>
</g><rect x="30" y="620" width="940" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="45" y="645" font-size="12" text-anchor="start" font-weight="normal" fill="#1e3a8a">统一坐标：z=旋转轴；xy=传感器平面；g=气隙；e=偏心；α=倾斜。</text>
<text x="45" y="667" font-size="11" text-anchor="start" font-weight="normal" fill="#475569">取向方向 ≠ 充磁方向 ≠ 传感器敏感轴。图为示意，非比例；具体场窗口、气隙和偏心限值必须绑定型号与磁体。</text>
</g></svg>
