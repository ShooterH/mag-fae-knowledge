<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620"> role="img" aria-labelledby="a02title a02desc">
  <title id="a02title">五类磁性的磁矩排列与有序度随温度变化</title>
  <desc id="a02desc">左侧用箭头排列区分抗磁、顺磁、铁磁、反铁磁和亚铁磁；右侧示意铁磁与亚铁磁在居里温度、反铁磁在奈尔温度以上失去自发有序。</desc>
  <defs>
    <marker id="a02-up" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3f51b5"/>
    </marker>
    <marker id="a02-down" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <text x="30" y="32" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#263238">看磁矩排列：五类磁性</text>

  <text x="30" y="80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">抗磁</text>
  <rect x="160" y="55" width="370" height="60" rx="8" fill="#f3f6ff" stroke="#c5cae9"/>
  <line x1="250" y1="70" x2="250" y2="100" stroke="#ef6c00" stroke-width="3" marker-end="url(#a02-down)"/>
  <line x1="330" y1="70" x2="330" y2="100" stroke="#ef6c00" stroke-width="3" marker-end="url(#a02-down)"/>
  <line x1="410" y1="70" x2="410" y2="100" stroke="#ef6c00" stroke-width="3" marker-end="url(#a02-down)"/>
  <text x="450" y="82" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">χ &lt; 0，约 10⁻⁵</text>
  <text x="450" y="102" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">感应磁矩与外场反向</text>

  <text x="30" y="170" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">顺磁</text>
  <rect x="160" y="145" width="370" height="60" rx="8" fill="#f3f6ff" stroke="#c5cae9"/>
  <line x1="215" y1="190" x2="215" y2="160" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="270" y1="160" x2="270" y2="190" stroke="#ef6c00" stroke-width="3" marker-end="url(#a02-down)"/>
  <line x1="325" y1="190" x2="325" y2="160" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="380" y1="160" x2="380" y2="190" stroke="#ef6c00" stroke-width="3" marker-end="url(#a02-down)"/>
  <line x1="435" y1="190" x2="435" y2="160" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <text x="460" y="172" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">χ &gt; 0，约 10⁻⁵–10⁻³</text>
  <text x="460" y="192" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">热运动使取向随机</text>

  <text x="30" y="260" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">铁磁</text>
  <rect x="160" y="235" width="370" height="60" rx="8" fill="#e8eefc" stroke="#9fa8da"/>
  <line x1="215" y1="280" x2="215" y2="250" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="270" y1="280" x2="270" y2="250" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="325" y1="280" x2="325" y2="250" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="380" y1="280" x2="380" y2="250" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="435" y1="280" x2="435" y2="250" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <text x="460" y="262" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">χ 很大，T &lt; T_C</text>
  <text x="460" y="282" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">交换作用使自旋平行</text>

  <text x="30" y="350" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">反铁磁</text>
  <rect x="160" y="325" width="370" height="60" rx="8" fill="#fff8e1" stroke="#ffe082"/>
  <line x1="215" y1="370" x2="215" y2="340" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="270" y1="340" x2="270" y2="370" stroke="#ef6c00" stroke-width="3" marker-end="url(#a02-down)"/>
  <line x1="325" y1="370" x2="325" y2="340" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <line x1="380" y1="340" x2="380" y2="370" stroke="#ef6c00" stroke-width="3" marker-end="url(#a02-down)"/>
  <line x1="435" y1="370" x2="435" y2="340" stroke="#3f51b5" stroke-width="3" marker-end="url(#a02-up)"/>
  <text x="460" y="352" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">净 M ≈ 0，T &lt; T_N</text>
  <text x="460" y="372" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">两套子晶格反向等强</text>

  <text x="30" y="440" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">亚铁磁</text>
  <rect x="160" y="415" width="370" height="60" rx="8" fill="#e8f5e9" stroke="#a5d6a7"/>
  <line x1="215" y1="470" x2="215" y2="430" stroke="#3f51b5" stroke-width="4" marker-end="url(#a02-up)"/>
  <line x1="270" y1="440" x2="270" y2="460" stroke="#ef6c00" stroke-width="2" marker-end="url(#a02-down)"/>
  <line x1="325" y1="470" x2="325" y2="430" stroke="#3f51b5" stroke-width="4" marker-end="url(#a02-up)"/>
  <line x1="380" y1="440" x2="380" y2="460" stroke="#ef6c00" stroke-width="2" marker-end="url(#a02-down)"/>
  <line x1="435" y1="470" x2="435" y2="430" stroke="#3f51b5" stroke-width="4" marker-end="url(#a02-up)"/>
  <text x="460" y="442" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">净 M ≠ 0，T &lt; T_C</text>
  <text x="460" y="462" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">反向但不等强，如铁氧体</text>

  <line x1="565" y1="55" x2="565" y2="510" stroke="#cfd8dc" stroke-width="1.5"/>

  <text x="715" y="32" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#263238">自发有序程度随温度（示意）</text>

  <line x1="610" y1="455" x2="845" y2="455" stroke="#37474f" stroke-width="2" marker-end="url(#a02-down)"/>
  <line x1="610" y1="455" x2="610" y2="75" stroke="#37474f" stroke-width="2" marker-end="url(#a02-up)"/>
  <text x="838" y="480" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#37474f">T</text>
  <text x="585" y="82" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#37474f">有序度</text>

  <path d="M620,120 C650,120 675,130 700,155 C720,180 730,230 742,330 L760,455" fill="none" stroke="#3f51b5" stroke-width="3"/>
  <path d="M620,145 C645,145 660,150 675,170 C690,195 695,240 702,330 L715,455" fill="none" stroke="#ef6c00" stroke-width="3" stroke-dasharray="7 4"/>

  <line x1="760" y1="455" x2="760" y2="105" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="715" y1="455" x2="715" y2="105" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="765" y="100" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1a237e">T<tspan baseline-shift="sub" font-size="0.72em">C</tspan></text>
  <text x="688" y="100" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">T<tspan baseline-shift="sub" font-size="0.72em">N</tspan></text>

  <text x="620" y="520" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">实线：铁磁/亚铁磁；虚线：反铁磁。</text>
  <text x="620" y="542" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">T<tspan baseline-shift="sub" font-size="0.72em">C</tspan>、T<tspan baseline-shift="sub" font-size="0.72em">N</tspan> 以上都转为顺磁；曲线为示意。</text>

  <text x="30" y="520" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">箭头长度表示磁矩大小；示意图不是晶格结构图，也不是实测曲线。</text>
</svg>
