<line x1="722.5" y1="510" x2="722.5" y2="516" stroke="#334155" stroke-width="1"/>
<text x="722.5" y="530" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">6 ms</text>
<line x1="831.25" y1="510" x2="831.25" y2="516" stroke="#334155" stroke-width="1"/>
<text x="831.25" y="530" font-size="9" text-anchor="middle" font-weight="normal" fill="#475569">7 ms</text>
