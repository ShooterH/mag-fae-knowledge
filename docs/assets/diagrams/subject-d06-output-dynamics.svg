<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="t d" width="1000" height="820">
<title id="t">分辨率、采样、带宽与输出</title><desc id="d">分辨率量化台阶、噪声与误差的量级对比、采样与滤波延迟时间轴，以及 359.9 度到 0.1 度的角度回绕示例。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
</defs>
<rect width="1000" height="820" fill="#ffffff"/>
<g font-family="font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#1f2937">
<text x="30" y="32" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2937">分辨率、采样、带宽与输出：四个容易混在一起的量</text>
<text x="30" y="55" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">数值为示例或数据手册条件；具体接口、时序和带宽必须看目标器件（示意，非比例）</text>
<rect x="30" y="75" width="460" height="225" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50" y="102" font-size="13" text-anchor="start" font-weight="bold" fill="#1e3a8a">分辨率：量化台阶</text>
<line x1="60" y1="270" x2="300" y2="270" stroke="#334155" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="60" y1="270" x2="60" y2="120" stroke="#334155" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="306" y="274" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">θ</text>
<text x="54" y="114" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">输出</text>
<polyline points="60.0,251.0 84.0,251.0 84.0,237.0 84.0,237.0 108.0,237.0 108.0,223.0 108.0,223.0 132.0,223.0 132.0,209.0 132.0,209.0 156.0,209.0 156.0,195.0 156.0,195.0 180.0,195.0 180.0,181.0 180.0,181.0 204.0,181.0 204.0,167.0 204.0,167.0 228.0,167.0 228.0,153.0 228.0,153.0 252.0,153.0 252.0,139.0 252.0,139.0 276.0,139.0 276.0,125.0 276.0,125.0 300.0,125.0" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="50" y="292" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">Δθ = 360° / 2^N，只是输出最小步进</text>
<text x="320" y="132" font-size="11" text-anchor="start" font-weight="normal" fill="#334155">10 bit：0.3516°</text>
<text x="320" y="156" font-size="11" text-anchor="start" font-weight="normal" fill="#334155">12 bit：0.0879°</text>
<text x="320" y="180" font-size="11" text-anchor="start" font-weight="normal" fill="#334155">14 bit：0.0220°</text>
<text x="320" y="204" font-size="11" text-anchor="start" font-weight="normal" fill="#334155">16 bit：0.0055°</text>
<text x="320" y="238" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">位数增加只缩小台阶，</text>
<text x="320" y="256" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">不自动降低噪声、INL 或温漂。</text>
<rect x="510" y="75" width="460" height="225" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="530" y="102" font-size="13" text-anchor="start" font-weight="bold" fill="#1e3a8a">同一量级：四个不同的指标</text>
<text x="530" y="134" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">量化台阶 LSB</text>
