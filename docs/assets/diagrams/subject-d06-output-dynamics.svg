<text x="679.612" y="134" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">0.0879°</text>
<text x="530" y="164" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">AS5600 噪声（慢滤波）</text>
<rect x="650" y="155" width="4.2" height="10" rx="3" fill="#047857" opacity="0.75"/>
<text x="659.2" y="164" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">0.015°</text>
<text x="530" y="194" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">AS5600 噪声（快滤波）</text>
<rect x="650" y="185" width="12.04" height="10" rx="3" fill="#047857" opacity="0.75"/>
<text x="667.04" y="194" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">0.043°</text>
<text x="530" y="224" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">AS5600 INL（最大）</text>
<rect x="650" y="215" width="280.0" height="10" rx="3" fill="#b45309" opacity="0.75"/>
<text x="935.0" y="224" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">1°</text>
<text x="530" y="254" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">TLE5501 角度误差（条件见正文）</text>
