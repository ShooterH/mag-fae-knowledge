<text x="50" y="597" font-size="13" text-anchor="start" font-weight="bold" fill="#1e3a8a">角度回绕：359.9° → 0.1° 不是 -359.8°</text>
<line x1="80" y1="680" x2="920" y2="680" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="80" y="702" font-size="11" text-anchor="middle" font-weight="normal" fill="#334155">0°</text>
<text x="920" y="702" font-size="11" text-anchor="middle" font-weight="normal" fill="#334155">360°</text>
<text x="500.0" y="702" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">角度</text>
<circle cx="84" cy="680" r="4" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
<circle cx="916" cy="680" r="4" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
<text x="860" y="662" font-size="10" text-anchor="middle" font-weight="normal" fill="#b45309">359.9°</text>
<text x="135" y="662" font-size="10" text-anchor="middle" font-weight="normal" fill="#b45309">0.1°</text>
<line x1="840" y1="642" x2="160" y2="642" stroke="#047857" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="500.0" y="634" font-size="10" text-anchor="middle" font-weight="bold" fill="#047857">正向跨零：+0.2°</text>
<line x1="160" y1="608" x2="840" y2="608" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="500.0" y="600" font-size="10" text-anchor="middle" font-weight="bold" fill="#b91c1c">反向跨零：-0.2°</text>
<rect x="80" y="720" width="840" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="95" y="744" font-size="12" text-anchor="start" font-weight="normal" fill="#1e3a8a">展开：Δ = (θ_new − θ_old + 180°) mod 360° − 180°</text>
<text x="95" y="766" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">例：359.9°→0.1° 得 +0.2°；0.1°→359.9° 得 -0.2°。多圈位置还需额外的圈数计数。</text>
