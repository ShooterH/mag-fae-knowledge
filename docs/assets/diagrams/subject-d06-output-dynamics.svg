<text x="879.0" y="254" font-size="9" text-anchor="start" font-weight="normal" fill="#334155">0.8°</text>
<text x="530" y="292" font-size="9" text-anchor="start" font-weight="normal" fill="#475569">分辨率、噪声、INL、总误差不能互相替代；比较时必须带条件。</text>
