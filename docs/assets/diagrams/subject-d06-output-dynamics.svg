<line x1="613.75" y1="502" x2="613.75" y2="486" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="722.5" y1="502" x2="722.5" y2="486" stroke="#1d4ed8" stroke-width="1.6"/>
