<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" role="img" aria-labelledby="c01Title c01Desc" height="520">
  <title id="c01Title">软磁参数不是一个常数：材料磁导率与带气隙磁芯有效磁导率</title>
  <desc id="c01Desc">左图示意首象限 B-H 曲线上的初始磁导率、最大磁导率和幅值磁导率；右图示意同一材料做成带气隙磁芯后有效磁导率下降的关系。图为示意，非实测，不按比例。</desc>
  <style>
    .bg{fill:#ffffff}
    .axis{stroke:#5b6b7c;stroke-width:1.5;fill:none}
    .grid{stroke:#dfe8f0;stroke-width:1}
    .curve{fill:none;stroke:#2f6f9f;stroke-width:2.6}
    .dash{fill:none;stroke:#7b8fa3;stroke-width:1.6;stroke-dasharray:6 4}
    .accent{fill:none;stroke:#c0504d;stroke-width:2;stroke-dasharray:7 4}
    .lbl{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#26323d}
    .small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:12.5px;fill:#55636f}
    .tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:11.5px;fill:#6b7885}
    .title{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:17px;font-weight:600;fill:#1f3344}
    .box{fill:#f4f8fc;stroke:#b9cfe1;stroke-width:1}
    .core{fill:none;stroke:#8aa6bd;stroke-width:18;stroke-linejoin:round}
    .corehole{fill:#ffffff;stroke:none}
    .gap{fill:#ffffff;stroke:none}
    .dot{fill:#c0504d;stroke:#ffffff;stroke-width:1.5}
  </style>

  <rect class="bg" x="0" y="0" width="880" height="520"/>
  <text class="title" x="40" y="34">软磁参数不是一个常数：材料参数与磁芯有效参数</text>

  <!-- Left panel: B-H curve -->
  <text class="lbl" x="62" y="66" font-weight="600">(a) 同一材料的 B–H 曲线</text>
  <line class="grid" x1="70" y1="382" x2="430" y2="382"/>
  <line class="grid" x1="70" y1="300" x2="430" y2="300"/>
  <line class="grid" x1="70" y1="220" x2="430" y2="220"/>
  <line class="grid" x1="70" y1="140" x2="430" y2="140"/>
  <line class="axis" x1="70" y1="420" x2="438" y2="420"/>
  <line class="axis" x1="70" y1="420" x2="70" y2="86"/>
  <path class="axis" d="M430,420 L438,420 M430,420 L424,416 M430,420 L424,424" stroke-width="1.5"/>
  <path class="axis" d="M70,86 L70,78 M70,86 L66,92 M70,86 L74,92" stroke-width="1.5"/>
  <text class="small" x="400" y="442">H（A/m）</text>
  <text class="small" x="26" y="150" transform="rotate(-90 26 150)">B（T）</text>

  <path class="curve" d="M70,420 C100,418 130,406 158,372 C188,335 208,268 238,214 C268,162 300,136 340,122 C374,113 405,110 428,110"/>
  <line class="dash" x1="70" y1="420" x2="190" y2="392"/>
  <text class="small" x="104" y="380">μ<tspan font-size="10" dy="3">i</tspan><tspan dy="-3">：H→0 的斜率</tspan></text>

  <line class="accent" x1="176" y1="315" x2="300" y2="148"/>
  <line class="dash" x1="300" y1="204" x2="284" y2="178"/>
  <text class="small" x="304" y="212" fill="#a34543">μ<tspan font-size="10" dy="3">max</tspan><tspan dy="-3">：最陡处</tspan></text>

  <line class="dash" x1="70" y1="420" x2="356" y2="120"/>
  <circle class="dot" cx="356" cy="120" r="4"/>
  <line class="dash" x1="356" y1="120" x2="356" y2="420"/>
  <line class="dash" x1="70" y1="120" x2="356" y2="120"/>
  <text class="small" x="244" y="352" transform="rotate(-38 244 352)">μ<tspan font-size="10" dy="3">a</tspan><tspan dy="-3">：工作点割线</tspan></text>
  <text class="tiny" x="362" y="414">工作点</text>

  <text class="tiny" x="72" y="466">曲线形状随材料、频率、偏置和温度变化；这里只示意三种斜率的定义。</text>

  <!-- Right panel: gapped core -->
  <rect class="box" x="486" y="58" width="360" height="440" rx="8"/>
  <text class="lbl" x="506" y="84" font-weight="600">(b) 同一材料做成带气隙磁芯</text>

  <rect class="core" x="550" y="160" width="240" height="200" rx="16"/>
  <rect class="corehole" x="598" y="208" width="144" height="104" rx="4"/>
  <rect class="gap" x="650" y="146" width="40" height="30"/>
  <text class="small" x="648" y="136">气隙 s</text>
  <line class="axis" x1="670" y1="140" x2="670" y2="160" stroke-width="1"/>
  <text class="small" x="674" y="250">μ<tspan font-size="10" dy="3">i</tspan></text>
  <text class="tiny" x="510" y="330" transform="rotate(-90 510 330)">有效磁路长度 l<tspan font-size="10" dy="3">e</tspan></text>

  <text class="lbl" x="508" y="410">μ<tspan font-size="10" dy="3">e</tspan><tspan dy="-3"> ≈ μ</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3"> / [1 + (s / l</tspan><tspan font-size="10" dy="3">e</tspan><tspan dy="-3">) · μ</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3">]</tspan></text>
  <text class="tiny" x="508" y="438">适用条件：s ≪ l<tspan font-size="10" dy="3">e</tspan><tspan dy="-3">，且忽略边缘漏磁与饱和。</tspan></text>
  <text class="small" x="508" y="470" fill="#a34543">μ<tspan font-size="10" dy="3">e</tspan><tspan dy="-3"> 降低，但抗饱和与储能能力通常改善。</tspan></text>

  <text class="tiny" x="40" y="508">示意，非按比例、非实测；不同材料与磁芯的曲线和数值须以现行数据表及实测为准。</text>
</svg>
