<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" role="img" aria-labelledby="c04Title c04Desc" height="600">
  <title id="c04Title">永磁体第二象限退磁曲线、负载线与工作点</title>
  <desc id="c04Desc">在第二象限示意 B-H 与 J-H 退磁曲线、两条不同斜率的负载线、工作点、剩磁、两种矫顽力和工作点能量矩形。Hm 取负值，负载线用幅值定义 Pc。图为教学示意，不对应实际牌号。</desc>
  <style>
    .bg{fill:#ffffff}
    .axis{stroke:#5b6b7c;stroke-width:1.5;fill:none}
    .grid{stroke:#dfe8f0;stroke-width:1}
    .bh{fill:none;stroke:#2f6f9f;stroke-width:2.8}
    .jh{fill:none;stroke:#c0504d;stroke-width:2.8}
    .load{stroke:#d98324;stroke-width:2.2;fill:none}
    .loaddash{stroke:#d98324;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .guide{stroke:#9aa8b5;stroke-width:1;stroke-dasharray:4 4;fill:none}
    .rect{fill:#fbe9d2;opacity:0.75;stroke:#d9a35e;stroke-width:1}
    .lbl{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#26323d}
    .small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:12.5px;fill:#55636f}
    .tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:11.5px;fill:#6b7885}
    .title{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:17px;font-weight:600;fill:#1f3344}
    .dot{fill:#d98324;stroke:#ffffff;stroke-width:1.6}
    .dot2{fill:#2f6f9f;stroke:#ffffff;stroke-width:1.6}
    .legend{fill:#f7fafc;stroke:#c9d7e3;stroke-width:1}
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="600"/>
  <text class="title" x="40" y="34">永磁体的第二象限：退磁曲线、负载线与工作点</text>

  <!-- grid -->
  <line class="grid" x1="110" y1="382.9" x2="740" y2="382.9"/>
  <line class="grid" x1="110" y1="265.7" x2="740" y2="265.7"/>
  <line class="grid" x1="110" y1="148.6" x2="740" y2="148.6"/>
  <line class="grid" x1="242.5" y1="90" x2="242.5" y2="500"/>
  <line class="grid" x1="375" y1="90" x2="375" y2="500"/>
  <line class="grid" x1="507.5" y1="90" x2="507.5" y2="500"/>

  <!-- axes -->
  <line class="axis" x1="110" y1="500" x2="742" y2="500" marker-end="url(#ar)"/>
  <line class="axis" x1="110" y1="500" x2="110" y2="86" marker-end="url(#ar)"/>
  <text class="small" x="676" y="524">H（kA/m）</text>
  <text class="small" x="66" y="300" transform="rotate(-90 66 300)">B（T）</text>

  <!-- ticks -->
  <g class="tiny">
    <text x="110" y="520" text-anchor="middle">-1200</text>
    <text x="242.5" y="520" text-anchor="middle">-900</text>
    <text x="375" y="520" text-anchor="middle">-600</text>
    <text x="507.5" y="520" text-anchor="middle">-300</text>
    <text x="640" y="520" text-anchor="middle">0</text>
    <text x="100" y="504" text-anchor="end">0</text>
    <text x="100" y="387" text-anchor="end">0.4</text>
    <text x="100" y="270" text-anchor="end">0.8</text>
    <text x="100" y="153" text-anchor="end">1.2</text>
  </g>

  <!-- curves -->
  <path class="bh" d="M640,148.6 L428,334 C380,390 330,445 264.6,500"/>
  <path class="jh" d="M640,148.6 L428,157.4 C360,195 250,350 145.3,500"/>

  <!-- load lines -->
  <line class="load" x1="640" y1="500" x2="501.7" y2="269.6"/>
  <line class="loaddash" x1="501.7" y1="269.6" x2="441" y2="169"/>
  <line class="load" x1="640" y1="500" x2="434.2" y2="328.6"/>

  <!-- operating-point energy rectangle -->
  <rect class="rect" x="501.7" y="269.6" width="138.3" height="230.4"/>
  <text class="tiny" x="566" y="456" fill="#8a5a24">Bm × |Hm|</text>

  <!-- guides -->
  <line class="guide" x1="501.7" y1="269.6" x2="501.7" y2="500"/>
  <line class="guide" x1="501.7" y1="269.6" x2="110" y2="269.6"/>

  <!-- points -->
  <circle class="dot" cx="501.7" cy="269.6" r="6"/>
  <circle class="dot2" cx="434.2" cy="328.6" r="5.5"/>
  <text class="lbl" x="495" y="248" text-anchor="end">P（Pc = 2）</text>
  <text class="lbl" x="398" y="352">P₂（Pc = 1）</text>
  <text class="small" x="508" y="536">Hm = -313 kA/m</text>
  <text class="small" x="516" y="260">Bm = 0.787 T</text>

  <!-- labels -->
  <text class="small" x="630" y="138" text-anchor="end">Br = 1.20 T</text>
  <text class="small" x="244" y="548" fill="#a34543">HcB</text>
  <text class="small" x="124" y="548" fill="#a34543">HcJ</text>
  <text class="tiny" x="560" y="390" fill="#8a5a24">Pc = 2</text>
  <text class="tiny" x="500" y="424" fill="#8a5a24">Pc = 1</text>

  <!-- legend -->
  <rect class="legend" x="676" y="70" width="204" height="126" rx="6"/>
  <text class="small" x="690" y="92" font-weight="600">图例</text>
  <line class="bh" x1="690" y1="110" x2="726" y2="110"/>
  <text class="tiny" x="734" y="114">B–H（法向）</text>
  <line class="jh" x1="690" y1="132" x2="726" y2="132"/>
  <text class="tiny" x="734" y="136">J–H（内禀）</text>
  <line class="load" x1="690" y1="154" x2="726" y2="154"/>
  <text class="tiny" x="734" y="158">负载线</text>
  <circle class="dot" cx="700" cy="176" r="5"/>
  <text class="tiny" x="734" y="180">工作点</text>

  <text class="small" x="40" y="576">约定：第二象限 Hm &lt; 0；负载线斜率取正，Pc = Bm / (μ₀|Hm|)。</text>
  <text class="tiny" x="40" y="594">教学线性段假设 Br = 1.20 T、μr = 1.05，只在 |H| ≤ 500 kA/m 内使用；曲线、膝点与 HcJ 为示意，不对应任何实际牌号。</text>
</svg>
