<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480"> role="img" aria-labelledby="a03title a03desc">
  <title id="a03title">磁畴随外场增大的三阶段示意</title>
  <desc id="a03desc">左图为零外场时的多畴与闭合畴，中图为畴壁移动使与外场同向的畴长大，右图为磁矩转动并趋于饱和。</desc>
  <defs>
    <marker id="a03-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3f51b5"/>
    </marker>
    <marker id="a03-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <text x="30" y="32" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#263238">同一块铁磁体，外场增大时磁畴怎样变化</text>

  <text x="150" y="72" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">H = 0：多畴，净 M ≈ 0</text>
  <rect x="50" y="110" width="200" height="210" fill="#f5f7ff" stroke="#3f51b5" stroke-width="2"/>
  <line x1="150" y1="110" x2="150" y2="320" stroke="#7986cb" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="100" y1="280" x2="100" y2="150" stroke="#3f51b5" stroke-width="3" marker-end="url(#a03-blue)"/>
  <line x1="200" y1="150" x2="200" y2="280" stroke="#ef6c00" stroke-width="3" marker-end="url(#a03-orange)"/>
  <path d="M50,110 L100,110 L100,150 L50,150 Z" fill="#e8eefc" stroke="#9fa8da"/>
  <path d="M200,110 L250,110 L250,150 L200,150 Z" fill="#fff3e0" stroke="#ffcc80"/>
  <line x1="60" y1="130" x2="95" y2="130" stroke="#3f51b5" stroke-width="2" marker-end="url(#a03-blue)"/>
  <line x1="205" y1="130" x2="240" y2="130" stroke="#ef6c00" stroke-width="2" marker-end="url(#a03-orange)"/>
  <text x="95" y="345" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">闭合畴降低退磁能</text>
  <text x="155" y="305" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5c6bc0">180° 畴壁</text>

  <text x="440" y="72" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">H 增大：畴壁移动</text>
  <rect x="340" y="110" width="200" height="210" fill="#f5f7ff" stroke="#3f51b5" stroke-width="2"/>
  <line x1="390" y1="110" x2="390" y2="320" stroke="#7986cb" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="470" y1="110" x2="470" y2="320" stroke="#7986cb" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="365" y1="280" x2="365" y2="150" stroke="#3f51b5" stroke-width="3" marker-end="url(#a03-blue)"/>
  <line x1="430" y1="280" x2="430" y2="150" stroke="#3f51b5" stroke-width="3" marker-end="url(#a03-blue)"/>
  <line x1="505" y1="150" x2="505" y2="280" stroke="#ef6c00" stroke-width="3" marker-end="url(#a03-orange)"/>
  <text x="430" y="345" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">同向畴长大，反向畴缩小</text>
  <line x1="340" y1="90" x2="395" y2="90" stroke="#2e7d32" stroke-width="2" marker-end="url(#a03-blue)"/>
  <text x="405" y="95" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1b5e20">H</text>

  <text x="730" y="72" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">H 很大：磁矩转动</text>
  <rect x="630" y="110" width="200" height="210" fill="#f5f7ff" stroke="#3f51b5" stroke-width="2"/>
  <line x1="665" y1="280" x2="665" y2="150" stroke="#3f51b5" stroke-width="3" marker-end="url(#a03-blue)"/>
  <line x1="705" y1="280" x2="705" y2="150" stroke="#3f51b5" stroke-width="3" marker-end="url(#a03-blue)"/>
  <line x1="745" y1="280" x2="745" y2="150" stroke="#3f51b5" stroke-width="3" marker-end="url(#a03-blue)"/>
  <line x1="785" y1="280" x2="785" y2="150" stroke="#3f51b5" stroke-width="3" marker-end="url(#a03-blue)"/>
  <text x="730" y="345" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">趋近饱和，畴壁基本消失</text>
  <line x1="630" y1="90" x2="720" y2="90" stroke="#2e7d32" stroke-width="2" marker-end="url(#a03-blue)"/>
  <text x="730" y="95" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1b5e20">H</text>

  <text x="30" y="415" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">示意：矩形代表一块磁性样品，不是单个晶粒；虚线是磁矩方向的过渡区，不是材料裂缝。</text>
  <text x="30" y="440" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">真实畴结构还受晶粒、缺陷、应力和表面影响；三格只表示趋势。</text>
</svg>
