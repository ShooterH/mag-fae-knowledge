<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" width="1000" height="600">
<title id="t">MR 的三种结构：AMR、GMR 与 TMR</title><desc id="d">三种磁电阻结构的剖面示意和角度响应曲线。AMR 为单层铁磁膜，原始电阻随电流与磁化夹角呈 180 度周期；GMR 和 TMR 为多层膜，电阻随自由层与钉扎层相对角变化，可呈 360 度周期。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
</defs>
<rect width="1000" height="600" fill="#ffffff"/>
<g font-family="font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#1f2937">
<text x="30" y="32" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2937">MR 的三种结构：AMR / GMR / TMR</text>
<text x="30" y="55" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">结构剖面与角度响应（示意，非按比例；曲线为教学模型，不代表具体芯片）</text>
<rect x="30" y="75" width="300" height="245" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="180" y="100" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">AMR：单层铁磁膜</text>
<rect x="350" y="75" width="300" height="245" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="500" y="100" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">GMR：多层膜/自旋阀</text>
<rect x="670" y="75" width="300" height="245" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="820" y="100" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">TMR：磁性隧道结</text>
<rect x="55" y="205" width="250" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="180" y="223" font-size="11" text-anchor="middle" font-weight="normal" fill="#475569">基底</text>
<rect x="55" y="166" width="250" height="34" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="70" y="188" font-size="12" text-anchor="start" font-weight="normal" fill="#1e3a8a">铁磁层</text>
<text x="70" y="158" font-size="10" text-anchor="start" font-weight="normal" fill="#1e3a8a">电流在膜面内</text>
<line x1="130" y1="193" x2="300" y2="193" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arB)"/>
<text x="300" y="185" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4ed8">I</text>
<line x1="160" y1="193" x2="220" y2="158" stroke="#b45309" stroke-width="2.4" marker-end="url(#arR)"/>
<text x="225" y="158" font-size="12" text-anchor="start" font-weight="bold" fill="#b45309">M(θ)</text>
<text x="55" y="285" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2937">R(θ)=R⊥+ΔR·cos²θ</text>
<text x="55" y="307" font-size="11" text-anchor="start" font-weight="normal" fill="#475569">原始电阻周期约 180°：θ 与 θ+180° 同值</text>
<rect x="380" y="145" width="190" height="34" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
<text x="400" y="166.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">自由层</text>
<rect x="380" y="184" width="190" height="20" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<text x="400" y="198.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">Cu 隔离层</text>
<rect x="380" y="209" width="190" height="34" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="400" y="230.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">钉扎层</text>
<rect x="380" y="248" width="190" height="30" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.2"/>
<text x="400" y="267.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">反铁磁层</text>
<line x1="370" y1="128" x2="585" y2="128" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arB)"/>
<text x="378" y="120" font-size="10" text-anchor="start" font-weight="normal" fill="#1d4ed8">I ∥ 膜面</text>
<text x="380" y="300" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">自由层 / 隔离层 / 钉扎层 / 反铁磁层</text>
<text x="380" y="320" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">电阻随自由层—钉扎层相对角 φ 变化</text>
<rect x="735" y="150" width="170" height="30" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
<text x="752" y="169.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">自由层</text>
