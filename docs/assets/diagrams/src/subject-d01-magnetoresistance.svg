<text x="752" y="225.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">钉扎层</text>
<rect x="735" y="241" width="170" height="26" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.2"/>
<text x="752" y="258.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">反铁磁层</text>
<line x1="715" y1="140" x2="715" y2="300" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arB)"/>
<text x="705" y="160" font-size="10" text-anchor="end" font-weight="normal" fill="#1d4ed8">I ⊥ 膜面</text>
<text x="735" y="310" font-size="10" text-anchor="start" font-weight="normal" fill="#475569">自旋相关隧穿</text>
<text x="60" y="355" font-size="13" text-anchor="start" font-weight="bold" fill="#334155">角度响应（归一化电阻）</text>
