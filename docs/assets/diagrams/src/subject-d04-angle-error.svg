<text x="45" y="695" font-size="11" text-anchor="start" font-weight="normal" fill="#1e3a8a">读图要点：偏置把圆心挪走，主要产生 1×；幅值不等把圆拉成轴长不同的椭圆，主要产生 2×；</text>
<text x="45" y="716" font-size="11" text-anchor="start" font-weight="normal" fill="#1e3a8a">正交误差让两轴不正交，产生 2× 加一个常数偏置。它们都不是唯一指纹：机械偏心、磁体缺陷、</text>
<text x="45" y="737" font-size="11" text-anchor="start" font-weight="normal" fill="#1e3a8a">传感器非线性、温漂也可能落在同一谐波上。频谱只提供候选原因，故障归因仍需实测与对照。</text>
<text x="45" y="762" font-size="9" text-anchor="start" font-weight="normal" fill="#475569">图中正交误差的 δ 已放大到 20° 以便观察；正文算例使用数据手册的 10° 上限。</text>
</g></svg>
