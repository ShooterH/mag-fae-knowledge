<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" width="1000" height="560">
<title id="t">机械角、电角度与极对数</title><desc id="d">以三对极电机为例，把机械角与取模后的电角度画成锯齿波，并用矢量图表示 A 相轴线、d 轴、编码器零点和电角度。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<g font-family="font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#1f2937">
<text x="30" y="32" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2937">机械角与电角度：一圈机械角，p 圈电角度</text>
<text x="30" y="55" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">示例 p=3；θe=(p·θm) mod 360°。图为示意，不对应具体电机</text>
<rect x="30" y="78" width="590" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="70" y1="450" x2="590" y2="450" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="70" y1="450" x2="70" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="62" y="92" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">θe</text>
<text x="598" y="442" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">θm</text>
<line x1="70.0" y1="450" x2="70.0" y2="455" stroke="#334155" stroke-width="1"/>
<text x="70.0" y="470" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">0°</text>
<line x1="243.33333333333331" y1="450" x2="243.33333333333331" y2="455" stroke="#334155" stroke-width="1"/>
<text x="243.33333333333331" y="470" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">120°</text>
<line x1="416.66666666666663" y1="450" x2="416.66666666666663" y2="455" stroke="#334155" stroke-width="1"/>
<text x="416.66666666666663" y="470" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">240°</text>
<line x1="590.0" y1="450" x2="590.0" y2="455" stroke="#334155" stroke-width="1"/>
<text x="590.0" y="470" font-size="10" text-anchor="middle" font-weight="normal" fill="#475569">360°</text>
<line x1="65" y1="450.0" x2="70" y2="450.0" stroke="#334155" stroke-width="1"/>
<text x="60" y="454.0" font-size="10" text-anchor="end" font-weight="normal" fill="#475569">0°</text>
<line x1="65" y1="275.0" x2="70" y2="275.0" stroke="#334155" stroke-width="1"/>
<text x="60" y="279.0" font-size="10" text-anchor="end" font-weight="normal" fill="#475569">180°</text>
<line x1="65" y1="100.0" x2="70" y2="100.0" stroke="#334155" stroke-width="1"/>
<text x="60" y="104.0" font-size="10" text-anchor="end" font-weight="normal" fill="#475569">360°</text>
<polyline points="70.0,450.0 243.3,100.0 243.3,450.0 416.7,100.0 416.7,450.0 590.0,100.0 590.0,450.0" fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="113.33333333333333" y1="450" x2="113.33333333333333" y2="362.5" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 3"/>
<line x1="70" y1="362.5" x2="113.33333333333333" y2="362.5" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 3"/>
<circle cx="113.33333333333333" cy="362.5" r="4" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
<text x="121.33333333333333" y="354.5" font-size="10" text-anchor="start" font-weight="bold" fill="#b45309">30° → 90°</text>
<rect x="640" y="78" width="330" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="660" y="105" font-size="12" text-anchor="start" font-weight="bold" fill="#1e3a8a">角度参考与零点（示意）</text>
<circle cx="790" cy="250" r="125" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="645" y1="250" x2="940" y2="250" stroke="#334155" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="945" y="254" font-size="11" text-anchor="start" font-weight="bold" fill="#334155">A 相</text>
<line x1="790" y1="250" x2="885.7555553898723" y2="169.65154878918258" stroke="#b45309" stroke-width="2.6" marker-end="url(#arR)"/>
<text x="891.7555553898723" y="163.65154878918258" font-size="11" text-anchor="start" font-weight="bold" fill="#b45309">d 轴</text>
<polyline points="838.0,250.0 838.0,248.3 837.9,246.7 837.7,245.0 837.5,243.3 837.3,241.7 837.0,240.0 836.6,238.4 836.1,236.8 835.7,235.2 835.1,233.6 834.5,232.0 833.9,230.5 833.1,229.0 832.4,227.5 831.6,226.0 830.7,224.6 829.8,223.2 828.8,221.8 827.8,220.4 826.8,219.1" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="848" y="222" font-size="11" text-anchor="start" font-weight="bold" fill="#1d4ed8">θe</text>
<line x1="790" y1="250" x2="903.2884733795812" y2="302.8272827175874" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="898.2884733795812" y="320.8272827175874" font-size="9" text-anchor="middle" font-weight="normal" fill="#7c3aed">编码器零点</text>
<text x="660" y="395" font-size="11" text-anchor="start" font-weight="bold" fill="#1e3a8a">Np = 磁极数（本文记号）</text>
<text x="660" y="415" font-size="11" text-anchor="start" font-weight="bold" fill="#1e3a8a">p = Np/2 = 极对数</text>
<text x="660" y="435" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937">θe = p·θm，再对 360° 取模</text>
<text x="660" y="455" font-size="9" text-anchor="start" font-weight="normal" fill="#b91c1c">MOTOR-01 公式里的 Np 是极对数，不是磁极数</text>
<rect x="30" y="485" width="940" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="45" y="508" font-size="12" text-anchor="start" font-weight="normal" fill="#1e3a8a">14 个磁极 → Np=14，p=7；机械转 30° → 电角度 7×30°=210°。</text>
<text x="45" y="528" font-size="11" text-anchor="start" font-weight="normal" fill="#475569">若把 14 当极对数，会得到 420°→60°，与正确的 210° 相差 150°，换相必然错误。</text>
</g></svg>
