<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560"> role="img" aria-labelledby="a04title a04desc">
  <title id="a04title">各向异性能、形状各向异性和磁致伸缩示意</title>
  <desc id="a04desc">左图为单轴各向异性能随磁化方向角的变化，易轴在 0 度和 180 度；右上图对比长棒与薄片的形状各向异性；右下图对比正、负磁致伸缩的长度变化。</desc>
  <defs>
    <marker id="a04-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3f51b5"/>
    </marker>
    <marker id="a04-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <text x="30" y="32" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#263238">方向为什么会改变磁化难易</text>

  <text x="235" y="65" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">单轴各向异性能 E<tspan baseline-shift="sub" font-size="0.72em">a</tspan>(θ)</text>
  <line x1="65" y1="310" x2="430" y2="310" stroke="#37474f" stroke-width="2"/>
  <line x1="65" y1="310" x2="65" y2="80" stroke="#37474f" stroke-width="2"/>
  <text x="430" y="355" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#37474f">θ</text>
  <text x="35" y="85" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#37474f">E<tspan baseline-shift="sub" font-size="0.72em">a</tspan></text>
  <text x="65" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">0°</text>
  <text x="160" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">90°</text>
  <text x="255" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">180°</text>
  <text x="350" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">270°</text>
  <text x="430" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">360°</text>

  <path d="M65,280 C95,280 110,110 160,110 C210,110 225,280 255,280 C285,280 310,110 350,110 C390,110 410,280 430,280" fill="none" stroke="#3f51b5" stroke-width="3"/>
  <text x="65" y="300" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1a237e">易轴</text>
  <text x="160" y="95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">难轴</text>
  <text x="255" y="300" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1a237e">易轴</text>
  <text x="350" y="95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">难轴</text>
  <text x="70" y="375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">简化模型 E<tspan baseline-shift="sub" font-size="0.72em">a</tspan> ≈ K₀ + K₁sin²θ：</text>
  <text x="70" y="398" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">K₁ &gt; 0 时，θ = 0°、180° 附近能量最低。</text>

  <line x1="460" y1="55" x2="460" y2="520" stroke="#cfd8dc" stroke-width="1.5"/>

  <text x="670" y="65" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">形状各向异性</text>

  <rect x="500" y="110" width="170" height="45" rx="6" fill="#e8eefc" stroke="#3f51b5"/>
  <line x1="525" y1="133" x2="640" y2="133" stroke="#3f51b5" stroke-width="3" marker-end="url(#a04-blue)"/>
  <text x="585" y="98" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1a237e">长棒：长轴易磁化</text>
  <text x="585" y="180" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">长轴退磁因子小</text>

  <rect x="730" y="95" width="55" height="90" rx="4" fill="#fff3e0" stroke="#ef6c00"/>
  <line x1="705" y1="115" x2="755" y2="115" stroke="#ef6c00" stroke-width="2" marker-end="url(#a04-orange)"/>
  <line x1="705" y1="145" x2="755" y2="145" stroke="#ef6c00" stroke-width="2" marker-end="url(#a04-orange)"/>
  <line x1="705" y1="175" x2="755" y2="175" stroke="#ef6c00" stroke-width="2" marker-end="url(#a04-orange)"/>
  <text x="758" y="215" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">薄片：法向难磁化</text>
  <text x="758" y="236" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#455a64">法向退磁因子大</text>

  <text x="670" y="300" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1a237e">磁致伸缩 λ = Δl / l</text>

  <rect x="520" y="340" width="170" height="28" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <line x1="500" y1="354" x2="540" y2="354" stroke="#2e7d32" stroke-width="2" marker-end="url(#a04-blue)"/>
  <line x1="690" y1="354" x2="730" y2="354" stroke="#2e7d32" stroke-width="2" marker-end="url(#a04-blue)"/>
  <text x="670" y="332" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#1b5e20">λ &gt; 0：沿场方向伸长</text>

  <rect x="545" y="430" width="120" height="28" rx="4" fill="#fff3e0" stroke="#ef6c00"/>
  <line x1="700" y1="444" x2="660" y2="444" stroke="#ef6c00" stroke-width="2" marker-end="url(#a04-orange)"/>
  <line x1="510" y1="444" x2="550" y2="444" stroke="#ef6c00" stroke-width="2" marker-end="url(#a04-orange)"/>
  <text x="670" y="422" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#bf360c">λ &lt; 0：沿场方向缩短</text>

  <text x="500" y="505" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">长度变化通常在 ppm 量级；箭头长度不代表真实比例。</text>
  <text x="30" y="505" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#455a64">示意：易轴、难轴和形状效应都是能量图像，不是固定几何方向。</text>
</svg>
